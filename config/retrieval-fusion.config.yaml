# ============================================================
# 天枢多路检索 & MemoryInjector 融合权重配置
# 唯一权威来源：所有权重/预算/阈值从此读取，禁止 ts 硬编码魔法数字
# ============================================================

# ── 注入层权重（MemoryInjector 使用，拿到召回结果后排序）──
# 说明：同等条件下数值越高优先级越高；会话上下文不在此，由 chat 主链路直接前置
inject_priority:
  archive_tag:     0.95   # 档案标签
  black_diamond:   0.90   # 黑钻库珍藏记忆
  vault:           0.70   # 金库（事实、承诺、重要沉淀）
  memory_normal:   0.60   # 普通砂金库记忆

# timeline 钙化记忆权重：min(base + calcium * scale, cap)，且最低不低于 memory_normal
timeline_weight:
  base: 0.3
  scale: 0.2
  cap: 0.9
  min_val: 0.6   # 修复倒挂：钙化≥1 的 timeline 不低于普通砂金 0.6

# ── Foundation 多路 RRF 检索域权重（m4/retrieval/fusion.ts）──
foundation_rrf_domain_weight:
  black_diamond: 0.25
  vault:         0.12
  knowledge:     0.15
  sand_memory:   0.10
  # ADR-010 P1-C1: 对话块（一段连贯场景，多轮聚合）。
  # 高于单条对话(conversation 0.05)与记事(note 0.08) —— 块是中期记忆的主要承载者；
  # 低于黑钻(0.25 附近的同档) —— 块是原始素材，黑钻是已提炼的结论。
  # ⚠️ 该值必须同时在 src/m4/retrieval/fusion.ts 的 FOUNDATION_DEFAULT_WEIGHTS 里映射，
  #    否则 RRFFusion 的 `weights[route] ?? 0.05` 兜底会把块静默降到最低档。
  dialog_group:  0.28
  # Phase 2.2 (B1/T004): 会晤「高钙对话组」通道（A 链路块级钙化召回）。
  # 高于普通块(0.28)：这是**不需要字面命中**也能被召回的重要对话组（地标语义），
  # 低于黑钻 —— 它仍是原始块素材而非已提炼结论。
  # ⚠️ 同样必须在 src/m4/retrieval/fusion.ts 的 FOUNDATION_DEFAULT_WEIGHTS 里映射，
  #    否则 RRFFusion 的 `weights[route] ?? 0.05` 会把它静默降到最低档（与 dialog_group 同一个坑）。
  high_calcium_group: 0.30

# ── V13 七层管线 RRF 权重（RRFFusion.ts）──
v13_rrf_weights:
  spine:            0.35
  keyword:          0.30
  work:             0.25
  entity:           0.20
  emotion:          0.10
  locus:            0.05
  multi_hit_bonus:  1.2

# ── 预算配置（MemoryInjector）──
budget:
  mem_ratio_normal:   0.60
  kb_ratio_normal:    0.40
  mem_ratio_longtext: 0.30
  kb_ratio_longtext:  0.15
  longtext_max_ratio: 0.80
  work_max_chars:     4000
  hard_max_chars: 8000
  # Phase 2.2 (B1/T004): 会晤高钙对话组独立配额（**不占** memories 槽位名额）
  # 实测 A/B（2026-10-20，70 组/实体 recall@3）：配额3=51.4%（未达≥60%验收线）→
  #   配额5=**67.1%**（达标）→ 配额8=77.1%。故取 5：达标且注入增量可控（3 条三层摘要 ≈ 300-500 token）。
  high_calcium_group_limit: 5
  high_calcium_floor: 5            # block_calcium_score >= 5 才进候选（与 2.1 consolidating 同源阈值）
  high_calcium_settle_minutes: 30  # 沉淀窗：闭组不足 30 分钟不参与召回（业主 2026-10-18 裁决）

# ── Phase 2.3 (F / T005): A/B 链路统一召回配额 ──
# 真源代码：src/m4/retrieval/recall-quota.ts（纯函数）；接线：src/webui/chat/retrieval-stage.ts
# 语义：把「高钙组(A) / 对话组摘要(B) / 单条记忆(近期)」三类按比例切分**记忆预算**，
#       防止某一类把预算吃光导致另外两类饿死。铁律/金库/作品/长文等 OTHER **不占配额**。
# 比例含义 = 占记忆预算 C 的份额，C = clamp(历史字符 × memory_max_ratio_of_history, 200, hard_max_chars)。
recall_quota:
  enabled: true                    # false = 一键回退：不裁剪 + 标签回到 2.3 之前（【X的记忆】）
                                   #        + 不做同组去重 ⇒ 片段形态与召回集合逐字回到 2.3 之前
  release_empty_class_quota: true  # 某类零供给时释放其份额（避免 A 无供给却平白锁死 40%）
  generic_query_min_hits: 1        # 泛词判据：经数据校验的关键词命中数低于此值 → A 降档
  meeting:                         # 会晤：A30% + B50% + 近期记忆20%（Harness²优化 2026-10-21）
    high_calcium_group: 0.30
    block_summary:     0.50
    recent_memory:     0.20
  normal:                          # 非会晤：B70% + A30%（Harness²优化 2026-10-21）
    block_summary:     0.70
    high_calcium_group: 0.30
  generic_query_high_calcium: 0.15 # 泛词时 A 的占比（P015 实测泛词 recall@3 仅 33%，钙化地标帮不上忙）

# ── 过滤阈值 ──
filter:
  min_similarity:  0.60
  max_fusion_items: 16

# ── 第二阶段 P0 响应速度专项 ──
# 说明: 无损耗提速，普通闲聊/碎片记忆瘦身；黑钻/金库/作品/长文/当前上下文豁免
speed_filter:
  second_filter_threshold: 0.15   # P0-1 二次精筛阈值: 记忆 vs 用户 query 相关性低于此值丢弃。S4-B2 实测: 相关记忆 0.17-0.51、无关 0.00 → 取 0.15 保相关除无关
  max_normal_memory_count: 10     # P0-3 普通碎片(sand/timeline)入池上限
  meeting_max_normal_memory_count: 20  # 2026-09-09 会晤场景放宽: 实体会晤需承载"昨天一天记忆"，10 条行碎片远不够(徐诗雨失忆链②修复)
  prompt_depth_enabled: true      # P0-2 会话模式分级加载总开关（false 强制 standard）

# ── 第二阶段 P1 响应提速 ──
# 说明: 降低 LLM 调用次数 + 外部依赖熔断。不牺牲质量/准确度，会晤模式默认全开（meeting_bypass）。
# enabled:false 一键回退全部旧行为
p1_speed:
  streaming:
    enabled: true          # 总开关: token 流式（job + 轮询/SSE）
    job_ttl_ms: 180000     # chat job TTL
    poll_hint_ms: 150      # 前端轮询间隔提示
  llm_reduction:
    enabled: true          # 总开关: false 恢复旧 4 条 LLM 全开
    meeting_bypass: true   # 会晤激活时跳过所有缩减（保持 4 条 LLM 全开）
    entity_conditional: true       # 实体提取条件化（无白名单/人名形态信号不走 LLM）
    pae_timeout_ms: 30000          # PAE LLM 超时（原 45s→8s 为防阻塞，PAE 已异步化不再阻塞主链，8s 导致 LLM 提取 100% 超时，回调到 30s）
    pae_signal_shortcircuit: true  # PAE 无新增档案信号短路
    kb_route_rule: true            # KB 路由纯规则（会晤保留 LLM）
    bionic_health_shortcircuit: true # Bionic 健康快照短路（7200 不可用不发网络）
    bionic_timeout_ms: 2500        # Bionic 搜索超时（原 5s）

# ── 对话块记忆总开关（ADR-010 P1-C1，2026-11-02 由 v11 改写）──
# 🔴 2026-11-02 业主裁决「彻底与过去决裂」：旧开关 enable_dialog_group_memory 已废弃，
#   由本开关取代。语义变更：
#     旧 = 开则用 n-gram 通道②，关则不注册（可一键回退到旧实现）
#     新 = 开则用 v11 结构化召回（recallByStructured + scoreAndRank），
#          关则该路不注册 —— **不存在回退到 n-gram 的路径**（旧实现在 B2 批次删除）。
# 生效点：src/m4/retrieval/index.ts 的 createDefaultRegistry。
dialog_group_v11_recall: true
