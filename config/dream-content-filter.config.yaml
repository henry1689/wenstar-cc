# M7 梦境内容过滤配置
# 共性解决方案：在配置层定义敏感词列表，代码层读取并过滤

# 🔴 敏感词列表
blocklist:
  # 拒绝/安全提示关键词
  - '没法'
  - '不能'
  - '无法'
  - '禁止'
  - '拒绝'
  - '不合适'
  - '不应该'
  # 未成年人相关
  - '14岁'
  - '15岁'
  - '16岁'
  - '未成年'
  - '初中生'
  - '初三'
  - '高一'
  # 敏感场景
  - '角色扮演'
  - '性相关'
  - '亲密行为'
  - '身体接触'
  # 系统提示词特征
  - '系统注意到'
  - '重要记忆'
  - '高钙化记忆'

# 过滤行为
filter:
  action: 'reject'  # reject: 拒绝生成, log: 仅记录
  log_level: 'warn'  # warn, error, info
  return_null: true  # 返回 null 而非抛出异常
